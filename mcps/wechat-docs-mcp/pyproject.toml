[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wechat-docs-mcp"
version = "0.3.0"
description = "Local governed WeChat and Tencent Docs event bridge for Codex"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "zstandard>=0.22,<1",
]

[project.scripts]
wechat-docs-mcp = "wechat_docs_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_docs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
