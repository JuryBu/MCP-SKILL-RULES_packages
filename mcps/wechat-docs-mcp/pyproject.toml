[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wechat-docs-mcp"
version = "0.4.6"
description = "Local governed WeChat and Tencent Docs event bridge for Codex"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "pillow>=11,<13",
  "pycryptodome>=3.23,<4",
  "pypdfium2>=4.30,<5",
  "pywin32>=311,<313; sys_platform == 'win32'",
  "zstandard>=0.22,<1",
]

[project.scripts]
wechat-docs-mcp = "wechat_docs_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_docs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
