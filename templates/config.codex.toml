# Add or merge these blocks into %USERPROFILE%/.codex/config.toml
# Apply-CodexConfig.ps1 separately ensures the top-level project_doc_max_bytes is at least 65536.
# Optional top-level setting. Install-CodexRulesProfile.ps1 -InstallSystemPrompt
# installs the template and maintains this pointer idempotently:
# model_instructions_file = "~/.codex/prompts/system-prompt.md"

# Optional current Codex Desktop features. Prefer applying them through
# Install-CodexRulesProfile.ps1 -InstallRecommendedDesktopFeatures so existing
# private config is backed up and merged instead of overwritten.
# [features]
# default_mode_request_user_input = true
# concurrent_reasoning_summaries = true
# prevent_idle_sleep = true
#
# [features.current_time_reminder]
# enabled = true
# reminder_interval_seconds = 120
# clock_source = "system"
# delivery_mode = "after_user_or_tool_output"
# sleep_tool = false

[mcp_servers.memory-store]
url = "http://127.0.0.1:14588/memory-store/mcp"
enabled = true

[mcp_servers.web-fetcher]
url = "http://127.0.0.1:14588/web-fetcher/mcp"
enabled = true

[mcp_servers.sandbox]
url = "http://127.0.0.1:14588/sandbox/mcp"
enabled = true

[mcp_servers.playwright]
url = "http://127.0.0.1:14588/playwright/mcp"
enabled = true

[mcp_servers.sequential-thinking]
url = "http://127.0.0.1:14588/sequential-thinking/mcp"
enabled = true

# [mcp_servers.exa]
# url = "http://127.0.0.1:14588/exa/mcp"
# enabled = true

# Optional QQ group collaboration endpoint. Enable the broker module and configure
# a receiver-owned NapCat installation before uncommenting this block.
# [mcp_servers.napcat]
# url = "http://127.0.0.1:14588/napcat/mcp"
# enabled = true


